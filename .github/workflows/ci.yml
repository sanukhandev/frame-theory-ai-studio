name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-and-schema:
    name: Documentation and schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release packaging shell syntax
        shell: bash
        run: sh -n scripts/package.sh
      - name: Validate repository docs and schema
        run: python3 scripts/validate_repository.py

  dotnet:
    name: .NET build and test (${{ matrix.os }})
    needs: docs-and-schema
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect solution
        id: detect
        shell: bash
        run: |
          if compgen -G '*.sln' > /dev/null || compgen -G '*.slnx' > /dev/null; then
            echo 'has_solution=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_solution=false' >> "$GITHUB_OUTPUT"
            echo 'No solution yet: documentation phase only.'
          fi
      - name: Set up .NET
        if: steps.detect.outputs.has_solution == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        if: steps.detect.outputs.has_solution == 'true'
        run: dotnet restore
      - name: Audit NuGet vulnerabilities
        if: steps.detect.outputs.has_solution == 'true'
        shell: pwsh
        run: ./scripts/check_nuget_vulnerabilities.ps1 -OutputPath artifacts/nuget-vulnerabilities.json
      - name: Generate NuGet dependency inventory
        if: steps.detect.outputs.has_solution == 'true'
        shell: pwsh
        run: |
          ./scripts/generate_sbom.ps1 -OutputPath artifacts/sbom/nuget-packages.json
          $licenses = @(Get-Content artifacts/sbom/nuget-licenses.json | ConvertFrom-Json)
          if ($licenses.Count -eq 0) {
            throw "NuGet license metadata report is empty."
          }
          if (-not ($licenses | Where-Object { $_.id -eq 'Avalonia' -and $_.licenseExpression -eq 'MIT' -and $_.metadataFound })) {
            throw "NuGet license metadata report did not include Avalonia MIT metadata."
          }
      - name: Build
        if: steps.detect.outputs.has_solution == 'true'
        run: dotnet build --no-restore -c Release
      - name: Launch desktop shell smoke
        if: steps.detect.outputs.has_solution == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke_desktop.ps1
      - name: Launch desktop UI automation smoke
        if: steps.detect.outputs.has_solution == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke_desktop_ui.ps1
      - name: Install FFmpeg for native media smoke
        if: steps.detect.outputs.has_solution == 'true'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y ffmpeg xvfb
              ;;
            macOS)
              brew install ffmpeg || brew upgrade ffmpeg
              ;;
            Windows)
              if choco install ffmpeg --no-progress -y; then
                export PATH="/c/ProgramData/chocolatey/bin:$PATH"
                echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
              else
                winget install --id Gyan.FFmpeg --exact --version 9.0.2 --source winget --scope user --silent --accept-source-agreements --accept-package-agreements
                ffmpeg_dir="$(pwsh -NoProfile -Command '$candidate = Get-ChildItem "$env:LOCALAPPDATA\\Microsoft\\WinGet\\Packages" -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Where-Object FullName -notmatch "Shared" | Select-Object -First 1; if ($candidate) { $candidate.DirectoryName }')"
                if [ -z "$ffmpeg_dir" ]; then
                  echo "WinGet installed FFmpeg but its executable path was not found." >&2
                  exit 1
                fi
                ffmpeg_dir="$(cygpath "$ffmpeg_dir")"
                export PATH="$ffmpeg_dir:$PATH"
                echo "$ffmpeg_dir" >> "$GITHUB_PATH"
              fi
              ;;
          esac
          ffmpeg -version
          ffprobe -version
          mkdir -p artifacts/sbom
          ffmpeg -version | tee artifacts/sbom/ffmpeg-version.txt
          ffmpeg -buildconf | tee artifacts/sbom/ffmpeg-buildconf.txt
          ffprobe -version | tee artifacts/sbom/ffprobe-version.txt
      - name: Run native media smoke
        if: steps.detect.outputs.has_solution == 'true'
        shell: bash
        run: |
          mkdir -p artifacts/media-smoke
          dotnet tools/FrameTheory.Fixtures/bin/Release/net10.0/FrameTheory.Fixtures.dll artifacts/media-smoke/fixtures
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc=size=16x8:rate=30:duration=1" \
            -f lavfi -i "sine=frequency=1000:sample_rate=48000:duration=1" \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest artifacts/media-smoke/clip.mp4
          cp artifacts/media-smoke/clip.mp4 artifacts/media-smoke/clip-b.mp4
          dotnet tools/FrameTheory.MediaImportSmoke/bin/Release/net10.0/FrameTheory.MediaImportSmoke.dll artifacts/media-smoke/clip.mp4 | tee artifacts/media-smoke/import.txt
          dotnet tools/FrameTheory.FrameDecodeSmoke/bin/Release/net10.0/FrameTheory.FrameDecodeSmoke.dll artifacts/media-smoke/clip.mp4 2 4 | tee artifacts/media-smoke/seek.txt
          grep -F 'kind=Video' artifacts/media-smoke/import.txt
          grep -F 'kind=Audio' artifacts/media-smoke/import.txt
          grep -F 'has_audio=True' artifacts/media-smoke/import.txt
          grep -F 'seek_p95_ms=' artifacts/media-smoke/seek.txt
          dotnet tools/FrameTheory.TimelineExportSmoke/bin/Release/net10.0/FrameTheory.TimelineExportSmoke.dll \
            artifacts/media-smoke/clip.mp4 \
            artifacts/media-smoke/clip-b.mp4 \
            artifacts/media-smoke/timeline.mp4 | tee artifacts/media-smoke/timeline.txt
          grep -F 'proxy=' artifacts/media-smoke/timeline.txt
          grep -F 'output=' artifacts/media-smoke/timeline.txt
          grep -F 'queue-retry-output=' artifacts/media-smoke/timeline.txt
          grep -F 'ai-output=' artifacts/media-smoke/timeline.txt
          grep -F 'batch-output=3' artifacts/media-smoke/timeline.txt
          grep -F 'rough-cut-output=' artifacts/media-smoke/timeline.txt
          grep -F 'reel-output=' artifacts/media-smoke/timeline.txt
          grep -F 'project-roundtrip=' artifacts/media-smoke/timeline.txt
          grep -F 'stabilization=5' artifacts/media-smoke/timeline.txt
          ffmpeg -hide_banner -loglevel error -y \
            -i artifacts/media-smoke/fixtures/test_chart.ppm \
            -frames:v 1 artifacts/media-smoke/photo-source.png
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=yellow:s=16x8:d=1 \
            -frames:v 1 artifacts/media-smoke/photo-overlay.png
          dotnet tools/FrameTheory.PhotoImportSmoke/bin/Release/net10.0/FrameTheory.PhotoImportSmoke.dll \
            artifacts/media-smoke/photo-source.png | tee artifacts/media-smoke/photo-import.txt
          grep -F 'kind=Image' artifacts/media-smoke/photo-import.txt
          dotnet tools/FrameTheory.PhotoExportSmoke/bin/Release/net10.0/FrameTheory.PhotoExportSmoke.dll \
            artifacts/media-smoke/photo-source.png \
            artifacts/media-smoke/photo-export.png png artifacts/media-smoke/photo-overlay.png | tee artifacts/media-smoke/photo-export.txt
          grep -F 'format=Png' artifacts/media-smoke/photo-export.txt
          grep -F 'overlays=1' artifacts/media-smoke/photo-export.txt
          grep -F 'masks=1' artifacts/media-smoke/photo-export.txt
          grep -F 'retouch=1' artifacts/media-smoke/photo-export.txt
          grep -F 'photo-project-roundtrip=' artifacts/media-smoke/photo-export.txt
      - name: Verify formatting
        if: steps.detect.outputs.has_solution == 'true'
        run: dotnet format --no-restore --verify-no-changes --verbosity minimal
      - name: Test
        if: steps.detect.outputs.has_solution == 'true'
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results
      - name: Publish desktop validation artifact
        if: steps.detect.outputs.has_solution == 'true'
        run: dotnet publish src/FrameTheory.Desktop/FrameTheory.Desktop.csproj --no-restore -c Release --no-self-contained -o artifacts/publish
      - name: Create portable validation archive
        if: steps.detect.outputs.has_solution == 'true'
        shell: pwsh
        run: ./scripts/archive_package.ps1 -PackageDirectory artifacts/publish -OutputPath artifacts/frame-theory-${{ matrix.platform }}-portable.zip
      - name: Verify portable archive contents
        if: steps.detect.outputs.has_solution == 'true'
        shell: pwsh
        run: |
          $archivePath = "artifacts/frame-theory-${{ matrix.platform }}-portable.zip"
          Add-Type -AssemblyName System.IO.Compression
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $archivePath).Path)
          try {
            if (-not ($archive.Entries.FullName -contains "FrameTheory.Desktop.dll")) {
              throw "Portable archive does not contain FrameTheory.Desktop.dll."
            }
          } finally {
            $archive.Dispose()
          }
      - name: Build Windows installer validation
        if: steps.detect.outputs.has_solution == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          ./scripts/package_windows.ps1 -OutputDirectory artifacts/installer -PublishDirectory artifacts/installer-publish
          $installer = Join-Path (Resolve-Path artifacts/installer).Path "FrameTheoryStudioAI-win-x64.exe"
          $installDirectory = Join-Path $env:RUNNER_TEMP "frame-theory-installed"
          if (Test-Path -LiteralPath $installDirectory) {
            Remove-Item -LiteralPath $installDirectory -Recurse -Force
          }
          Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDirectory") -Wait
          ./scripts/smoke_desktop.ps1 -AssemblyPath (Join-Path $installDirectory "FrameTheory.Desktop.exe") -RequireWindowTitle
          Start-Process -FilePath (Join-Path $installDirectory "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          if (Test-Path -LiteralPath $installDirectory) {
            throw "Windows installer uninstall left the installation directory behind."
          }
      - name: Build macOS DMG validation
        if: steps.detect.outputs.has_solution == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x scripts/package_macos_dmg.sh
          scripts/package_macos_dmg.sh "" artifacts/installer
          mkdir -p "$RUNNER_TEMP/frame-theory-dmg"
          hdiutil attach -nobrowse -readonly artifacts/installer/FrameTheoryStudioAI-*.dmg -mountpoint "$RUNNER_TEMP/frame-theory-dmg"
          test -x "$RUNNER_TEMP/frame-theory-dmg/Frame Theory Studio AI.app/Contents/MacOS/FrameTheoryStudio"
          pwsh -NoProfile -File ./scripts/smoke_desktop.ps1 -AssemblyPath "$RUNNER_TEMP/frame-theory-dmg/Frame Theory Studio AI.app/Contents/MacOS/FrameTheoryStudio"
          hdiutil detach "$RUNNER_TEMP/frame-theory-dmg"
      - name: Build Linux DEB validation
        if: steps.detect.outputs.has_solution == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x scripts/package_linux_deb.sh
          scripts/package_linux_deb.sh linux-x64 artifacts/installer
          dpkg-deb --info artifacts/installer/frame-theory-studio-ai_0.1.0_amd64.deb
          dpkg-deb --contents artifacts/installer/frame-theory-studio-ai_0.1.0_amd64.deb | grep -F '/usr/bin/frame-theory-studio-ai'
          deb_directory="$RUNNER_TEMP/frame-theory-deb"
          rm -rf "$deb_directory"
          mkdir -p "$deb_directory"
          dpkg-deb --extract artifacts/installer/frame-theory-studio-ai_0.1.0_amd64.deb "$deb_directory"
          xvfb-run -a pwsh -NoProfile -File ./scripts/smoke_desktop.ps1 -AssemblyPath "$deb_directory/opt/frame-theory-studio/FrameTheory.Desktop"
      - name: Launch extracted portable archive smoke
        if: steps.detect.outputs.has_solution == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $env:RUNNER_TEMP "frame-theory-portable-smoke"
          if (Test-Path -LiteralPath $packageDirectory) {
            Remove-Item -LiteralPath $packageDirectory -Recurse -Force
          }
          Expand-Archive -LiteralPath "artifacts/frame-theory-${{ matrix.platform }}-portable.zip" -DestinationPath $packageDirectory
          ./scripts/smoke_desktop.ps1 -RequireWindowTitle -AssemblyPath (Join-Path $packageDirectory "FrameTheory.Desktop.dll")
      - name: Launch extracted portable archive smoke (Unix)
        if: steps.detect.outputs.has_solution == 'true' && runner.os != 'Windows'
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $env:RUNNER_TEMP "frame-theory-portable-smoke"
          if (Test-Path -LiteralPath $packageDirectory) {
            Remove-Item -LiteralPath $packageDirectory -Recurse -Force
          }
          Expand-Archive -LiteralPath "artifacts/frame-theory-${{ matrix.platform }}-portable.zip" -DestinationPath $packageDirectory
          $assemblyPath = Join-Path $packageDirectory "FrameTheory.Desktop.dll"
          if ($IsLinux) {
            xvfb-run -a pwsh -NoProfile -File ./scripts/smoke_desktop.ps1 -AssemblyPath $assemblyPath
          } else {
            ./scripts/smoke_desktop.ps1 -AssemblyPath $assemblyPath
          }
      - name: Create SHA-256 manifest
        if: steps.detect.outputs.has_solution == 'true'
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts -File -Recurse | Sort-Object FullName
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName
            "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $file.FullName.Replace((Get-Location).Path + [IO.Path]::DirectorySeparatorChar, '')
          }
          $lines | Set-Content artifacts/SHA256SUMS.txt
      - name: Verify SHA-256 manifest
        if: steps.detect.outputs.has_solution == 'true'
        shell: pwsh
        run: ./scripts/verify_package.ps1 -PackageDirectory artifacts -ManifestPath artifacts/SHA256SUMS.txt
      - name: Upload validation artifacts
        if: always() && steps.detect.outputs.has_solution == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frame-theory-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn
