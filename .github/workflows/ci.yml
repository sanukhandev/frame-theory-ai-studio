name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-and-schema:
    name: Documentation and schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release packaging shell syntax
        shell: bash
        run: |
          sh -n scripts/package.sh
          sh -n scripts/package_macos_dmg.sh
          sh -n scripts/package_linux_deb.sh
      - name: Validate Windows package version guard
        shell: pwsh
        run: |
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/package_windows.ps1),
            [ref]$null,
            [ref]$parseErrors)
          if ($null -ne $parseErrors -and $parseErrors.Count -gt 0) {
            throw "Windows package script has parse errors: $parseErrors"
          }

          $null = & pwsh -NoProfile -File scripts/package_windows.ps1 -Version invalid 2>&1
          $childExitCode = $LASTEXITCODE
          if ($childExitCode -eq 0) {
            throw "Windows package version validation did not reject an invalid version."
          }
          $global:LASTEXITCODE = 0
          if (-not (Select-String -Path packaging/windows/FrameTheoryStudio.iss -Pattern 'OutputBaseFilename=\{#OutputBaseFilename\}')) {
            throw "Windows installer does not use the runtime-specific output filename macro."
          }
          $null = & pwsh -NoProfile -File scripts/package_windows.ps1 -RuntimeIdentifier win-arm64 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw "Windows package runtime validation accepted an unsupported RID."
          }
          $global:LASTEXITCODE = 0
      - name: Validate Linux package guards
        shell: bash
        run: |
          if output=$(sh scripts/package_linux_deb.sh linux-mips artifacts/installer 0.1.1 2>&1); then
            echo "$output"
            exit 1
          fi
          echo "$output" | grep -F 'Unsupported Linux runtime identifier'
          if output=$(sh scripts/package_linux_deb.sh linux-x64 artifacts/installer invalid 2>&1); then
            echo "$output"
            exit 1
          fi
          echo "$output" | grep -F 'Invalid package version'
          if grep -Fq "<<'PLIST'" scripts/package_macos_dmg.sh; then
            echo 'macOS package plist heredoc must expand the validated version.'
            exit 1
          fi
          grep -F 'plutil -lint "$app/Contents/Info.plist"' scripts/package_macos_dmg.sh
      - name: Validate macOS package guards
        shell: bash
        run: |
          if output=$(sh scripts/package_macos_dmg.sh osx-mips artifacts/installer 0.1.1 2>&1); then
            echo "$output"
            exit 1
          fi
          echo "$output" | grep -F 'Unsupported macOS runtime identifier'
          if output=$(sh scripts/package_macos_dmg.sh osx-x64 artifacts/installer invalid 2>&1); then
            echo "$output"
            exit 1
          fi
          echo "$output" | grep -F 'Invalid package version'
      - name: Validate native media bundle guards
        shell: pwsh
        run: |
          $windowsScripts = @('scripts/package.ps1', 'scripts/package_windows.ps1')
          foreach ($path in $windowsScripts) {
            $content = Get-Content -LiteralPath $path -Raw
            if ($content -notmatch 'FfmpegDirectory' -or $content -notmatch 'ffmpeg\.exe' -or $content -notmatch 'ffprobe\.exe') {
              throw "$path does not validate the Windows FFmpeg/ffprobe bundle pair."
            }
          }
          $unixScripts = @('scripts/package.sh', 'scripts/package_macos_dmg.sh', 'scripts/package_linux_deb.sh')
          foreach ($path in $unixScripts) {
            $content = Get-Content -LiteralPath $path -Raw
            if ($content -notmatch 'ffmpeg_directory' -or $content -notmatch 'ffmpeg' -or $content -notmatch 'ffprobe') {
              throw "$path does not validate the Unix FFmpeg/ffprobe bundle pair."
            }
          }
          $locator = Get-Content -LiteralPath 'src/FrameTheory.Media/FfmpegExecutableLocator.cs' -Raw
          if ($locator -notmatch 'FRAME_THEORY_FFMPEG_DIR' -or $locator -notmatch 'AppContext\.BaseDirectory') {
            throw 'Runtime media-tool locator does not cover the reviewed bundle directory and install directory.'
          }
      - name: Validate package manifest guards
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "frame-theory-manifest-package"
          $sibling = Join-Path $env:RUNNER_TEMP "frame-theory-manifest-package-sibling"
          if (Test-Path -LiteralPath $package) { Remove-Item -LiteralPath $package -Recurse -Force }
          if (Test-Path -LiteralPath $sibling) { Remove-Item -LiteralPath $sibling -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $package, $sibling | Out-Null
          Set-Content -LiteralPath (Join-Path $package "payload.txt") -Value "payload"
          Set-Content -LiteralPath (Join-Path $sibling "outside.bin") -Value "outside"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $package "payload.txt")).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $package "SHA256SUMS.txt") -Value ("{0}  payload.txt" -f $hash)
          & pwsh -NoProfile -File ./scripts/verify_package.ps1 -PackageDirectory $package -ManifestPath (Join-Path $package "SHA256SUMS.txt")
          if ($LASTEXITCODE -ne 0) { throw "A valid package manifest was rejected." }

          New-Item -ItemType Directory -Force -Path (Join-Path $package "nested") | Out-Null
          Set-Content -LiteralPath (Join-Path $package "nested/SHA256SUMS.txt") -Value "unlisted"
          $output = & pwsh -NoProfile -File ./scripts/verify_package.ps1 -PackageDirectory $package -ManifestPath (Join-Path $package "SHA256SUMS.txt") 2>&1
          if ($LASTEXITCODE -eq 0 -or (($output -join "`n") -notmatch 'Manifest covers')) {
            throw "An unlisted nested manifest was not rejected."
          }
          $global:LASTEXITCODE = 0

          $outsideHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $sibling "outside.bin")).Hash.ToLowerInvariant()
          $siblingName = Split-Path -Leaf $sibling
          Set-Content -LiteralPath (Join-Path $package "SHA256SUMS.txt") -Value ("{0}  {1}/outside.bin" -f $outsideHash, $siblingName)
          $verifier = Join-Path (Get-Location) "scripts/verify_package.ps1"
          Push-Location (Split-Path -Parent $package)
          try {
            $output = & pwsh -NoProfile -File $verifier -PackageDirectory $package -ManifestPath (Join-Path $package "SHA256SUMS.txt") 2>&1
            $exitCode = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($exitCode -eq 0 -or (($output -join "`n") -notmatch 'outside the package')) {
            throw "A sibling-prefix manifest escape was not rejected."
          }
          $global:LASTEXITCODE = 0
      - name: Validate repository docs and schema
        run: python3 scripts/validate_repository.py

  dotnet:
    name: .NET build and test (${{ matrix.os }})
    needs: docs-and-schema
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect solution
        id: detect
        shell: bash
        run: |
          if compgen -G '*.sln' > /dev/null || compgen -G '*.slnx' > /dev/null; then
            echo 'has_solution=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_solution=false' >> "$GITHUB_OUTPUT"
            echo 'No solution yet: documentation phase only.'
          fi
      - name: Set up .NET
        if: steps.detect.outputs.has_solution == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        if: steps.detect.outputs.has_solution == 'true'
        run: dotnet restore
      - name: Audit NuGet vulnerabilities
        if: steps.detect.outputs.has_solution == 'true'
        shell: pwsh
        run: ./scripts/check_nuget_vulnerabilities.ps1 -OutputPath artifacts/nuget-vulnerabilities.json
      - name: Generate NuGet dependency inventory
        if: steps.detect.outputs.has_solution == 'true'
        shell: pwsh
        run: |
          ./scripts/generate_sbom.ps1 -OutputPath artifacts/sbom/nuget-packages.json
          $licenses = @(Get-Content artifacts/sbom/nuget-licenses.json | ConvertFrom-Json)
          if ($licenses.Count -eq 0) {
            throw "NuGet license metadata report is empty."
          }
          if (-not ($licenses | Where-Object { $_.id -eq 'Avalonia' -and $_.licenseExpression -eq 'MIT' -and $_.metadataFound })) {
            throw "NuGet license metadata report did not include Avalonia MIT metadata."
          }
      - name: Build
        if: steps.detect.outputs.has_solution == 'true'
        run: dotnet build --no-restore -c Release
      - name: Launch desktop shell smoke
        if: steps.detect.outputs.has_solution == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke_desktop.ps1
      - name: Launch desktop UI automation smoke
        if: steps.detect.outputs.has_solution == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke_desktop_ui.ps1
      - name: Install FFmpeg for native media smoke
        if: steps.detect.outputs.has_solution == 'true'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y ffmpeg xvfb
              ;;
            macOS)
              brew install ffmpeg || brew upgrade ffmpeg
              ;;
            Windows)
              if choco install ffmpeg --no-progress -y; then
                export PATH="/c/ProgramData/chocolatey/bin:$PATH"
                echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
              else
                winget install --id Gyan.FFmpeg --exact --version 9.0.2 --source winget --scope user --silent --accept-source-agreements --accept-package-agreements
                ffmpeg_dir="$(pwsh -NoProfile -Command '$candidate = Get-ChildItem "$env:LOCALAPPDATA\\Microsoft\\WinGet\\Packages" -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Where-Object FullName -notmatch "Shared" | Select-Object -First 1; if ($candidate) { $candidate.DirectoryName }')"
                if [ -z "$ffmpeg_dir" ]; then
                  echo "WinGet installed FFmpeg but its executable path was not found." >&2
                  exit 1
                fi
                ffmpeg_dir="$(cygpath "$ffmpeg_dir")"
                export PATH="$ffmpeg_dir:$PATH"
                echo "$ffmpeg_dir" >> "$GITHUB_PATH"
              fi
              ;;
          esac
          ffmpeg -version
          ffprobe -version
          mkdir -p artifacts/sbom
          ffmpeg -version | tee artifacts/sbom/ffmpeg-version.txt
          ffmpeg -buildconf | tee artifacts/sbom/ffmpeg-buildconf.txt
          ffprobe -version | tee artifacts/sbom/ffprobe-version.txt
      - name: Run native media smoke
        if: steps.detect.outputs.has_solution == 'true'
        shell: bash
        run: |
          mkdir -p artifacts/media-smoke
          dotnet tools/FrameTheory.Fixtures/bin/Release/net10.0/FrameTheory.Fixtures.dll artifacts/media-smoke/fixtures
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc=size=16x8:rate=30:duration=1" \
            -f lavfi -i "sine=frequency=1000:sample_rate=48000:duration=1" \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest artifacts/media-smoke/clip.mp4
          cp artifacts/media-smoke/clip.mp4 artifacts/media-smoke/clip-b.mp4
          dotnet tools/FrameTheory.MediaImportSmoke/bin/Release/net10.0/FrameTheory.MediaImportSmoke.dll artifacts/media-smoke/clip.mp4 | tee artifacts/media-smoke/import.txt
          dotnet tools/FrameTheory.FrameDecodeSmoke/bin/Release/net10.0/FrameTheory.FrameDecodeSmoke.dll artifacts/media-smoke/clip.mp4 2 4 | tee artifacts/media-smoke/seek.txt
          grep -F 'kind=Video' artifacts/media-smoke/import.txt
          grep -F 'kind=Audio' artifacts/media-smoke/import.txt
          grep -F 'has_audio=True' artifacts/media-smoke/import.txt
          grep -F 'seek_p95_ms=' artifacts/media-smoke/seek.txt
          dotnet tools/FrameTheory.TimelineExportSmoke/bin/Release/net10.0/FrameTheory.TimelineExportSmoke.dll \
            artifacts/media-smoke/clip.mp4 \
            artifacts/media-smoke/clip-b.mp4 \
            artifacts/media-smoke/timeline.mp4 | tee artifacts/media-smoke/timeline.txt
          grep -F 'proxy=' artifacts/media-smoke/timeline.txt
          grep -F 'output=' artifacts/media-smoke/timeline.txt
          grep -F 'queue-retry-output=' artifacts/media-smoke/timeline.txt
          grep -F 'ai-output=' artifacts/media-smoke/timeline.txt
          grep -F 'batch-output=3' artifacts/media-smoke/timeline.txt
          grep -F 'rough-cut-output=' artifacts/media-smoke/timeline.txt
          grep -F 'reel-output=' artifacts/media-smoke/timeline.txt
          grep -F 'project-roundtrip=' artifacts/media-smoke/timeline.txt
          grep -F 'stabilization=5' artifacts/media-smoke/timeline.txt
          ffmpeg -hide_banner -loglevel error -y \
            -i artifacts/media-smoke/fixtures/test_chart.ppm \
            -frames:v 1 artifacts/media-smoke/photo-source.png
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=yellow:s=16x8:d=1 \
            -frames:v 1 artifacts/media-smoke/photo-overlay.png
          dotnet tools/FrameTheory.PhotoImportSmoke/bin/Release/net10.0/FrameTheory.PhotoImportSmoke.dll \
            artifacts/media-smoke/photo-source.png | tee artifacts/media-smoke/photo-import.txt
          grep -F 'kind=Image' artifacts/media-smoke/photo-import.txt
          dotnet tools/FrameTheory.PhotoExportSmoke/bin/Release/net10.0/FrameTheory.PhotoExportSmoke.dll \
            artifacts/media-smoke/photo-source.png \
            artifacts/media-smoke/photo-export.png png artifacts/media-smoke/photo-overlay.png | tee artifacts/media-smoke/photo-export.txt
          grep -F 'format=Png' artifacts/media-smoke/photo-export.txt
          grep -F 'overlays=1' artifacts/media-smoke/photo-export.txt
          grep -F 'masks=1' artifacts/media-smoke/photo-export.txt
          grep -F 'retouch=1' artifacts/media-smoke/photo-export.txt
          grep -F 'photo-project-roundtrip=' artifacts/media-smoke/photo-export.txt
      - name: Verify formatting
        if: steps.detect.outputs.has_solution == 'true'
        run: dotnet format --no-restore --verify-no-changes --verbosity minimal
      - name: Test
        if: steps.detect.outputs.has_solution == 'true'
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results
      - name: Publish desktop validation artifact
        if: steps.detect.outputs.has_solution == 'true'
        run: dotnet publish src/FrameTheory.Desktop/FrameTheory.Desktop.csproj --no-restore -c Release --no-self-contained -o artifacts/publish
      - name: Create portable validation archive
        if: steps.detect.outputs.has_solution == 'true'
        shell: pwsh
        run: ./scripts/archive_package.ps1 -PackageDirectory artifacts/publish -OutputPath artifacts/frame-theory-${{ matrix.platform }}-portable.zip
      - name: Verify portable archive contents
        if: steps.detect.outputs.has_solution == 'true'
        shell: pwsh
        run: |
          $archivePath = "artifacts/frame-theory-${{ matrix.platform }}-portable.zip"
          Add-Type -AssemblyName System.IO.Compression
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $archivePath).Path)
          try {
            if (-not ($archive.Entries.FullName -contains "FrameTheory.Desktop.dll")) {
              throw "Portable archive does not contain FrameTheory.Desktop.dll."
            }
          } finally {
            $archive.Dispose()
          }
      - name: Build Windows installer validation
        if: steps.detect.outputs.has_solution == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $bundleDirectory = Join-Path $env:RUNNER_TEMP "frame-theory-ffmpeg-bundle"
          New-Item -ItemType Directory -Force -Path $bundleDirectory | Out-Null
          Copy-Item -LiteralPath (Get-Command ffmpeg -ErrorAction Stop).Source -Destination (Join-Path $bundleDirectory "ffmpeg.exe") -Force
          Copy-Item -LiteralPath (Get-Command ffprobe -ErrorAction Stop).Source -Destination (Join-Path $bundleDirectory "ffprobe.exe") -Force
          ./scripts/package_windows.ps1 -OutputDirectory artifacts/installer -PublishDirectory artifacts/installer-publish -Version 0.1.1 -FfmpegDirectory $bundleDirectory
          $installer = Join-Path (Resolve-Path artifacts/installer).Path "FrameTheoryStudioAI-win-x64.exe"
          $installDirectory = Join-Path $env:RUNNER_TEMP "frame-theory-installed"
          if (Test-Path -LiteralPath $installDirectory) {
            Remove-Item -LiteralPath $installDirectory -Recurse -Force
          }
          Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDirectory") -Wait
          if (-not (Test-Path -LiteralPath (Join-Path $installDirectory "ffmpeg.exe")) -or -not (Test-Path -LiteralPath (Join-Path $installDirectory "ffprobe.exe"))) {
            throw "Windows installer did not include the validated FFmpeg/ffprobe pair."
          }
          $env:FRAME_THEORY_FFMPEG_DIR = $installDirectory
          $mediaSmoke = dotnet tools/FrameTheory.MediaImportSmoke/bin/Release/net10.0/FrameTheory.MediaImportSmoke.dll artifacts/media-smoke/clip.mp4
          if ($LASTEXITCODE -ne 0 -or $mediaSmoke -notmatch 'kind=Video') {
            throw "Windows packaged FFmpeg runtime smoke failed: $mediaSmoke"
          }
          ./scripts/smoke_desktop.ps1 -AssemblyPath (Join-Path $installDirectory "FrameTheory.Desktop.exe") -RequireWindowTitle
          Start-Process -FilePath (Join-Path $installDirectory "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          if (Test-Path -LiteralPath $installDirectory) {
            throw "Windows installer uninstall left the installation directory behind."
          }
      - name: Build macOS DMG validation
        if: steps.detect.outputs.has_solution == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x scripts/package_macos_dmg.sh
          bundle_directory="$RUNNER_TEMP/frame-theory-ffmpeg-bundle"
          rm -rf "$bundle_directory"
          mkdir -p "$bundle_directory"
          cp "$(command -v ffmpeg)" "$bundle_directory/ffmpeg"
          cp "$(command -v ffprobe)" "$bundle_directory/ffprobe"
          chmod +x "$bundle_directory/ffmpeg" "$bundle_directory/ffprobe"
          scripts/package_macos_dmg.sh "" artifacts/installer 0.1.1 "$bundle_directory"
          mkdir -p "$RUNNER_TEMP/frame-theory-dmg"
          dmg_mount="$RUNNER_TEMP/frame-theory-dmg"
          cleanup_dmg() { hdiutil detach "$dmg_mount" >/dev/null 2>&1 || true; }
          trap cleanup_dmg EXIT
          hdiutil attach -nobrowse -readonly artifacts/installer/FrameTheoryStudioAI-*.dmg -mountpoint "$dmg_mount"
          test -x "$dmg_mount/Frame Theory Studio AI.app/Contents/MacOS/FrameTheoryStudio"
          test -x "$dmg_mount/Frame Theory Studio AI.app/Contents/MacOS/ffmpeg"
          test -x "$dmg_mount/Frame Theory Studio AI.app/Contents/MacOS/ffprobe"
          FRAME_THEORY_FFMPEG_DIR="$dmg_mount/Frame Theory Studio AI.app/Contents/MacOS" \
            dotnet tools/FrameTheory.MediaImportSmoke/bin/Release/net10.0/FrameTheory.MediaImportSmoke.dll artifacts/media-smoke/clip.mp4 | tee "$RUNNER_TEMP/frame-theory-macos-bundled-media.txt"
          grep -F 'kind=Video' "$RUNNER_TEMP/frame-theory-macos-bundled-media.txt"
          bundle_version="$(plutil -extract CFBundleShortVersionString raw -o - "$dmg_mount/Frame Theory Studio AI.app/Contents/Info.plist")"
          echo "Mounted DMG bundle version: $bundle_version"
          test "$bundle_version" = "0.1.1"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$dmg_mount/Frame Theory Studio AI.app/Contents/Info.plist")" = "ai.frametheory.studio"
          test "$(plutil -extract CFBundleExecutable raw -o - "$dmg_mount/Frame Theory Studio AI.app/Contents/Info.plist")" = "FrameTheoryStudio"
          pwsh -NoProfile -File ./scripts/smoke_desktop.ps1 -AssemblyPath "$dmg_mount/Frame Theory Studio AI.app/Contents/MacOS/FrameTheoryStudio"
          hdiutil detach "$dmg_mount"
          trap - EXIT
      - name: Build Linux DEB validation
        if: steps.detect.outputs.has_solution == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x scripts/package_linux_deb.sh
          bundle_directory="$RUNNER_TEMP/frame-theory-ffmpeg-bundle"
          rm -rf "$bundle_directory"
          mkdir -p "$bundle_directory"
          cp "$(command -v ffmpeg)" "$bundle_directory/ffmpeg"
          cp "$(command -v ffprobe)" "$bundle_directory/ffprobe"
          chmod +x "$bundle_directory/ffmpeg" "$bundle_directory/ffprobe"
          scripts/package_linux_deb.sh linux-x64 artifacts/installer 0.1.1 "$bundle_directory"
          dpkg-deb --info artifacts/installer/frame-theory-studio-ai_0.1.1_amd64.deb
          test "$(dpkg-deb --field artifacts/installer/frame-theory-studio-ai_0.1.1_amd64.deb Version)" = "0.1.1"
          test "$(dpkg-deb --field artifacts/installer/frame-theory-studio-ai_0.1.1_amd64.deb Architecture)" = "amd64"
          dpkg-deb --contents artifacts/installer/frame-theory-studio-ai_0.1.1_amd64.deb | grep -F '/usr/bin/frame-theory-studio-ai'
          deb_directory="$RUNNER_TEMP/frame-theory-deb"
          rm -rf "$deb_directory"
          mkdir -p "$deb_directory"
          dpkg-deb --extract artifacts/installer/frame-theory-studio-ai_0.1.1_amd64.deb "$deb_directory"
          test -x "$deb_directory/opt/frame-theory-studio/ffmpeg"
          test -x "$deb_directory/opt/frame-theory-studio/ffprobe"
          test -x "$deb_directory/usr/bin/frame-theory-studio-ai"
          grep -F 'exec /opt/frame-theory-studio/FrameTheory.Desktop' "$deb_directory/usr/bin/frame-theory-studio-ai"
          xvfb-run -a pwsh -NoProfile -File ./scripts/smoke_desktop.ps1 -AssemblyPath "$deb_directory/opt/frame-theory-studio/FrameTheory.Desktop"
          sudo dpkg -i artifacts/installer/frame-theory-studio-ai_0.1.1_amd64.deb
          test -x /opt/frame-theory-studio/ffmpeg
          test -x /opt/frame-theory-studio/ffprobe
          FRAME_THEORY_FFMPEG_DIR=/opt/frame-theory-studio \
            dotnet tools/FrameTheory.MediaImportSmoke/bin/Release/net10.0/FrameTheory.MediaImportSmoke.dll artifacts/media-smoke/clip.mp4 | tee "$RUNNER_TEMP/frame-theory-linux-bundled-media.txt"
          grep -F 'kind=Video' "$RUNNER_TEMP/frame-theory-linux-bundled-media.txt"
          cleanup_deb() { sudo dpkg -r frame-theory-studio-ai >/dev/null 2>&1 || true; }
          trap cleanup_deb EXIT
          xvfb-run -a pwsh -NoProfile -File ./scripts/smoke_desktop.ps1 -AssemblyPath /opt/frame-theory-studio/FrameTheory.Desktop
          xvfb-run -a pwsh -NoProfile -File ./scripts/smoke_desktop.ps1 -AssemblyPath /usr/bin/frame-theory-studio-ai
          sudo dpkg -r frame-theory-studio-ai
          trap - EXIT
          test ! -e /opt/frame-theory-studio/FrameTheory.Desktop
      - name: Launch extracted portable archive smoke
        if: steps.detect.outputs.has_solution == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $env:RUNNER_TEMP "frame-theory-portable-smoke"
          if (Test-Path -LiteralPath $packageDirectory) {
            Remove-Item -LiteralPath $packageDirectory -Recurse -Force
          }
          Expand-Archive -LiteralPath "artifacts/frame-theory-${{ matrix.platform }}-portable.zip" -DestinationPath $packageDirectory
          ./scripts/smoke_desktop.ps1 -RequireWindowTitle -AssemblyPath (Join-Path $packageDirectory "FrameTheory.Desktop.dll")
      - name: Launch extracted portable archive smoke (Unix)
        if: steps.detect.outputs.has_solution == 'true' && runner.os != 'Windows'
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $env:RUNNER_TEMP "frame-theory-portable-smoke"
          if (Test-Path -LiteralPath $packageDirectory) {
            Remove-Item -LiteralPath $packageDirectory -Recurse -Force
          }
          Expand-Archive -LiteralPath "artifacts/frame-theory-${{ matrix.platform }}-portable.zip" -DestinationPath $packageDirectory
          $assemblyPath = Join-Path $packageDirectory "FrameTheory.Desktop.dll"
          if ($IsLinux) {
            xvfb-run -a pwsh -NoProfile -File ./scripts/smoke_desktop.ps1 -AssemblyPath $assemblyPath
          } else {
            ./scripts/smoke_desktop.ps1 -AssemblyPath $assemblyPath
          }
      - name: Create SHA-256 manifest
        if: steps.detect.outputs.has_solution == 'true'
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts -File -Recurse | Sort-Object FullName
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName
            "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $file.FullName.Replace((Get-Location).Path + [IO.Path]::DirectorySeparatorChar, '')
          }
          $lines | Set-Content artifacts/SHA256SUMS.txt
      - name: Verify SHA-256 manifest
        if: steps.detect.outputs.has_solution == 'true'
        shell: pwsh
        run: ./scripts/verify_package.ps1 -PackageDirectory artifacts -ManifestPath artifacts/SHA256SUMS.txt
      - name: Upload validation artifacts
        if: always() && steps.detect.outputs.has_solution == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frame-theory-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn
